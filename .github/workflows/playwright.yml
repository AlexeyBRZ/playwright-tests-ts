name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      SCOPE:
        description: 'Which tests to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - api
          - PO
          - homework24
          - full-test
      EXTRA_ARGS:
        description: 'Extra arguments for playwright test (e.g. --project=api-tests --headed)'
        required: false
        type: string

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript type checks
        run: npm run types:test

  api-tests:
    needs: type-check
    if: ${{ github.event.inputs.SCOPE == 'api' || github.event.inputs.SCOPE == 'all' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Run API tests
        run: npm run api
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: playwright-report/
          retention-days: 7

  po-tests:
    needs: type-check
    if: ${{ github.event.inputs.SCOPE == 'PO' || github.event.inputs.SCOPE == 'all' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Run PO tests
        run: npm run PO
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-po
          path: playwright-report/
          retention-days: 7

  homework24-tests:
    needs: type-check
    if: ${{ github.event.inputs.SCOPE == 'homework24' || github.event.inputs.SCOPE == 'all' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Run homework24 tests
        run: npm run homework24
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-homework24
          path: playwright-report/
          retention-days: 7

  full-tests:
    needs: type-check
    if: ${{ github.event.inputs.SCOPE == 'full-test' || github.event.inputs.SCOPE == 'all' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Run all Playwright tests
        env:
          EXTRA_ARGS: ${{ github.event.inputs.EXTRA_ARGS }}
        run: npx playwright test $EXTRA_ARGS
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: playwright-report/
          retention-days: 7

  
  publish-report:
    needs: [api-tests, po-tests, homework24-tests, full-tests]
    if: ${{ always() && (github.event.inputs.SCOPE == 'all' || github.event.inputs.SCOPE == 'full-test') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report-full
          destination_dir: playwright-report
          force_orphan: true  # перезаписываем старые отчёты

permissions:
  contents: read
  pages: write
  id-token: write