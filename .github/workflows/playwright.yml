name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # schedule:
  #   - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      SCOPE:
        description: 'Test scope to run'
        required: false
        default: 'full'
        type: choice
        options:
          - api
          - e2e
          - full
      RUN_ARGS:
        description: 'Additional arguments for the test run'
        required: false
        default: ''
        type: string

jobs:
  test-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript type checks
        run: npm run types:test

  api-tests:
    needs: test-types
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.SCOPE == 'api'
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright test --project api

  e2e-tests:
    needs: test-types
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.SCOPE == 'e2e'
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright test --project e2e

  full-tests:
    needs: test-types
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.SCOPE == 'full'
    steps:
      - uses: actions/checkout@v4
      - run: npm ci

      - name: Run Playwright tests
        env:
          SCOPE: ${{ github.event.inputs.SCOPE || 'full' }}
          RUN_ARGS: ${{ github.event.inputs.RUN_ARGS }}
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Scope: $SCOPE"

          if [ "${{ github.event_name }}" == "schedule" ]; then
            echo "Executing scheduled run..."
            npx playwright test
          elif [ "$SCOPE" == "api" ]; then
            npx playwright test --project api
          elif [ "$SCOPE" == "e2e" ]; then
            npx playwright test --project e2e
          elif [ -n "$RUN_ARGS" ]; then
            echo "Executing with custom args: $RUN_ARGS"
            npx playwright test $RUN_ARGS
          else
            echo "Falling back
